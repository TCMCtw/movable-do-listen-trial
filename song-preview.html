function answerFile(v, keyId) { return 'audio/' + (v === 'male' ? 'answer-bass-' : 'answer-') + keyId + '.m4a'; }
function fetchBuf(url) {
  const c = audioCtx();
  return fetch(url)
    .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
    .then(ab => c.decodeAudioData(ab));
}
let keyIdx = 0, voice = 'female';
const $ = id => document.getElementById(id);
let ac = null;
function audioCtx() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') void ac.resume();
  return ac;
}
function tone(freq, t, dur, amp) {
  const c = audioCtx();
  const g = c.createGain();
  g.gain.setValueAtTime(1e-4, t);
  g.gain.exponentialRampToValueAtTime(amp, t + 0.015);
  g.gain.setTargetAtTime(amp * 0.75, t + 0.015, Math.max(dur / 3, 0.03));
  g.gain.setValueAtTime(1e-4, t + dur);
  const o = c.createOscillator();
  o.type = 'sine'; o.frequency.value = freq;
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.1);
}
let sungSources = [];
function stopSung() { sungSources.forEach(s => { try { s.stop(); } catch (e) {} }); sungSources = []; }
const ansBufs = {};
function loadAnswer(keyId, v) {
  const cacheKey = v + ':' + keyId;
  if (ansBufs[cacheKey]) return ansBufs[cacheKey];
  let p = fetchBuf(answerFile(v, keyId)).then(buf => ({ buf: buf, used: v }));
  if (v === 'male') p = p.catch(() => fetchBuf(answerFile('female', keyId)).then(buf => ({ buf: buf, used: 'female' })));
  ansBufs[cacheKey] = p.catch(err => { delete ansBufs[cacheKey]; throw err; });
  return ansBufs[cacheKey];
}
const beatOf = f => 60 / (f.b || 90); // 每首各自 BPM(11-28 照 Ray 原檔;預設 90)
function playMelody(f) {
  stopSung();
  const c = audioCtx();
  let cur = c.currentTime + 0.1;
  f.m.forEach((off, i) => {
    const nn = noteAt(keyIdx + off, VOICES[voice].oct);
    const dur = Math.max(f.d[i] * beatOf(f), 0.12);
    tone(FREQ[nn], cur, Math.max(dur - 0.04, 0.1), 0.55);
    cur += dur;
  });
}
async function playAnswer(f, btn) {
  const keyId = ANSWER_KEYS[keyIdx];
  btn.disabled = true; btn.textContent = '載入中…';
  try {
    const ans = await loadAnswer(keyId, voice);
    const onsets = (GRID_ONSETS[ans.used] || {})[keyId];
    if (!onsets) throw new Error('no timing');
    const buf = ans.buf;
    stopSung();
    const c = audioCtx();
    let t = c.currentTime + 0.15;
    f.m.forEach((off, i) => {
      const g = OFF2GRID[off];
      if (g === undefined) return;
      const dur = Math.max(f.d[i] * beatOf(f), 0.12);
      const start = Math.max(onsets[g] - 0.1, 0);
      const nextOnset = (g + 1 < onsets.length) ? onsets[g + 1] - 0.15 : buf.duration;
      const len = Math.min(dur + 0.02, nextOnset - start, buf.duration - start);
      const src = c.createBufferSource(); src.buffer = buf;
      const gn = c.createGain();
      gn.gain.setValueAtTime(0, t);
      gn.gain.linearRampToValueAtTime(0.9, t + 0.02);
      gn.gain.setValueAtTime(0.9, t + Math.max(len - 0.05, 0.02));
      gn.gain.linearRampToValueAtTime(0, t + len);
      src.connect(gn); gn.connect(c.destination);
      src.start(t, start, len + 0.001);
      sungSources.push(src);
      t += dur;
    });
  } catch (e) { btn.textContent = '播放失敗'; }
  finally { btn.disabled = false; if (btn.textContent === '載入中…') btn.textContent = '人聲答案'; }
}
function sylText(f) {
  return f.m.map(off => { const v = OFF2SYL[off]; if (!v) return '?'; return v[1] > 0 ? v[0] + '.'.repeat(v[1]) : v[1] < 0 ? ','.repeat(-v[1]) + v[0] : v[0]; }).join(' ');
}
KEY_LABELS.forEach((label, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'btn' + (i === keyIdx ? ' sel' : ''); b.textContent = label;
  b.onclick = () => { keyIdx = i; document.querySelectorAll('#keys .btn').forEach((x, j) => x.classList.toggle('sel', j === i)); };
  $('keys').appendChild(b);
});
$('vof').onclick = () => { voice = 'female'; $('vof').classList.add('sel'); $('vom').classList.remove('sel'); };
$('vom').onclick = () => { voice = 'male'; $('vom').classList.add('sel'); $('vof').classList.remove('sel'); };
const sorted = [...SONG_FRAGS].sort((a, b) => a.t.localeCompare(b.t, 'zh-Hant'));
sorted.forEach(f => {
  const row = document.createElement('div'); row.className = 'song';
  const nm = document.createElement('div'); nm.className = 'nm';
  nm.innerHTML = '<strong>' + f.t + '</strong><span class="syl">' + sylText(f) + '</span>';
  const b1 = document.createElement('button'); b1.type = 'button'; b1.className = 'btn play'; b1.textContent = '旋律';
  b1.onclick = () => playMelody(f);
  const b2 = document.createElement('button'); b2.type = 'button'; b2.className = 'btn play'; b2.textContent = '人聲答案';
  b2.onclick = () => playAnswer(f, b2);
  row.appendChild(nm); row.appendChild(b1); row.appendChild(b2);
  $('list').appendChild(row);
});
